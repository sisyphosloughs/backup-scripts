; No outgoing mail, ever. Baïkal sends invitations (iMIP) through PHP's mail()
; as soon as "invite_from" is set — and the setup wizard pre-fills it. Leave
; that field empty (README.md); this is the second lock: mail() fails instead
; of mailing the real attendees of every imported event.
sendmail_path = /bin/false

expose_php = Off
